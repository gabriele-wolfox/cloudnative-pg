# PostgreSQL cluster with pgvector for RAG workloads.
#
# The "standard" image ships pgvector. The application user and password are
# generated by CloudNativePG in the `vectordb-app` secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vectordb
  namespace: llm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-bookworm

  storage:
    size: 5Gi

  bootstrap:
    initdb:
      database: ragdb
      owner: raguser
      # Runs inside `ragdb`, so the extension is ready for the app user
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"
      # Building HNSW indexes is much faster when it fits in memory
      maintenance_work_mem: "256MB"
